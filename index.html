<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Header</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom smooth transition for mobile drawer */
        #mobile-menu {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }

        /* Gradient background helper */
        .bg-brand-gradient {
            background: linear-gradient(90deg, #cc5446 0%, #cb5134 99%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header Container -->
    <header class="sticky top-0 z-50 w-full bg-brand-gradient shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <!-- Left Section: Logo & Brand Name -->
                <div class="flex items-center space-x-3">
                    <a href="#" class="relative block w-14 h-14 rounded-xl border-2 border-white/80 shadow-md overflow-hidden transition-transform duration-200 hover:scale-105 active:scale-95 shrink-0">
                        <img 
                            src="https://yt3.googleusercontent.com/JCthywth-W5JqLwhLLWFhQBue8qkNK5RTEwtGFdwpApqLnk3qQJJ5MIUZMtblo4pCr7terEeQw=s900-c-k-c0x00ffffff-no-rj" 
                            alt="ItsPhillip Logo" 
                            class="w-full h-full object-cover"
                            onerror="this.src='https://placehold.co/100x100/cc5446/ffffff?text=Logo'"
                        >
                    </a>
                    <a href="#" class="text-white font-bold text-xl tracking-wide hidden sm:block hover:opacity-90 transition-opacity">
                        ItsPhillip
                    </a>
                </div>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
                    <a href="#home" class="text-white/90 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg text-sm font-medium transition-colors">Home</a>
                    <a href="#about" class="text-white/90 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg text-sm font-medium transition-colors">About</a>
                    <a href="#sponsors" class="text-white/90 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg text-sm font-medium transition-colors">Sponsors</a>
                    <a href="#contact" class="text-white/90 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg text-sm font-medium transition-colors">Contact</a>
                </nav>

                <!-- Desktop CTA Button -->
                <div class="hidden md:flex items-center">
                    <a href="https://www.youtube.com/@itsphillip" target="_blank" rel="noopener noreferrer" class="bg-white text-[#cb5134] hover:bg-slate-100 font-semibold text-sm px-5 py-2.5 rounded-full shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
                        Subscribe
                    </a>
                </div>

                <!-- Mobile Hamburger Button -->
                <div class="flex md:hidden">
                    <button 
                        id="menu-btn" 
                        type="button" 
                        class="text-white hover:bg-white/10 p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50 transition-colors"
                        aria-label="Toggle Navigation Menu"
                        aria-expanded="false"
                    >
                        <!-- Hamburger Icon -->
                        <svg id="hamburger-icon" class="w-7 h-7 block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        <!-- Close (X) Icon -->
                        <svg id="close-icon" class="w-7 h-7 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- Mobile Drawer Navigation Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#bc483c] border-t border-white/10 px-4 pt-3 pb-6 space-y-2 shadow-inner">
            <a href="#home" class="mobile-link block text-white font-medium px-4 py-2.5 rounded-lg hover:bg-white/10 transition-colors">Home</a>
            <a href="#about" class="mobile-link block text-white/90 font-medium px-4 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors">About</a>
            <a href="#sponsors" class="mobile-link block text-white/90 font-medium px-4 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors">Sponsors</a>
            <a href="#contact" class="mobile-link block text-white/90 font-medium px-4 py-2.5 rounded-lg hover:bg-white/10 hover:text-white transition-colors">Contact</a>
            
            <div class="pt-4 border-t border-white/10">
                <a href="https://www.youtube.com/@itsphillip" target="_blank" rel="noopener noreferrer" class="mobile-link block w-full text-center bg-white text-[#cb5134] font-semibold px-4 py-3 rounded-xl shadow transition-colors hover:bg-slate-100">
                    Subscribe
                </a>
            </div>
        </div>
    </header>

    <!-- Page Content Placeholder to Demonstrate Navigation Overlay -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-200/80 text-center max-w-2xl mx-auto my-12">
            <h1 class="text-3xl font-bold text-slate-900 mb-4">Responsive Navigation Demo</h1>
            <p class="text-slate-600 leading-relaxed mb-6">
                Resize your browser window to test the mobile menu drawer or click the hamburger menu on smaller screens.
            </p>
            <span class="inline-block bg-orange-100 text-[#cb5134] px-4 py-1.5 rounded-full text-sm font-semibold">
                Gradient: #cc5446 ➔ #cb5134
            </span>
        </div>
    </main>

    <!-- Navigation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const hamburgerIcon = document.getElementById('hamburger-icon');
            const closeIcon = document.getElementById('close-icon');
            const mobileLinks = document.querySelectorAll('.mobile-link');

            function toggleMenu() {
                const isOpen = mobileMenu.classList.contains('hidden');
                
                if (isOpen) {
                    mobileMenu.classList.remove('hidden');
                    hamburgerIcon.classList.add('hidden');
                    closeIcon.classList.remove('hidden');
                    menuBtn.setAttribute('aria-expanded', 'true');
                } else {
                    mobileMenu.classList.add('hidden');
                    hamburgerIcon.classList.remove('hidden');
                    closeIcon.classList.add('hidden');
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
            }

            // Toggle menu on hamburger button click
            menuBtn.addEventListener('click', toggleMenu);

            // Close mobile menu when a navigation link is clicked
            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (!mobileMenu.classList.contains('hidden')) {
                        toggleMenu();
                    }
                });
            });

            // Close mobile menu on window resize if scaling up to desktop
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768 && !mobileMenu.classList.contains('hidden')) {
                    mobileMenu.classList.add('hidden');
                    hamburgerIcon.classList.remove('hidden');
                    closeIcon.classList.add('hidden');
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
            });
        });
    </script>
</body>
</html>
